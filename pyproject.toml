[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motiondisco"
dynamic = ["version"]
description = "LLM-driven contact plan search for long-horizon humanoid loco-manipulation"
authors = [
    {name = "Ilyass Taouil"},
    {name = "Michal Ciebelski"},
    {name = "Shafeef Omar"},
    {name = "Haizhou Zhao"},
    {name = "Angela Dai"},
    {name = "Aaron M. Johnson"},
    {name = "Majid Khadiv"},
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
urls = {Homepage = "https://github.com/Atarilab/motiondisco", Repository = "https://github.com/Atarilab/motiondisco", Paper = "https://arxiv.org/abs/2606.06139", Issues = "https://github.com/Atarilab/motiondisco/issues"}
dependencies = [
    "openai",
    "numpy",
    "pandas",
    "anthropic",
    "requests",
    "boto3",
    "pydantic",
    "backoff",
    "python-dotenv",
    "instructor",
    "python-Levenshtein",
    "radon",
    "unidiff",
    "dill",
    "hydra-core==1.3.2",
    "matplotlib",
    "networkx",
    "seaborn",
    "moviepy",
    "scikit-learn",
    "adjustText",
    "markdown",
    "aiofiles",
    "google-genai>=2.13,<3",
    "psutil",
    "httpx>=0.27"
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]

[project.scripts]
motiondisco_launch = "shinka.cli.launch:main"
motiondisco_models = "shinka.cli.models:main"
motiondisco_run = "shinka.cli.run:main"
motiondisco_visualize = "shinka.webui.visualization:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "shinka.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["shinka*"]

[tool.setuptools.package-data]
shinka = [
    "configs/*.yaml",
    "configs/*/*.yaml",
    "favicon.png",
    "tools/pricing/*.json",
    "embed/providers/*.csv",
    "llm/providers/*.csv",
    "webui/*.html",
    "webui/*.png",
    "webui/*.jpg",
]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "ruff==0.15.6",
    "mypy",
    "black",
    "isort",
    "flake8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
    "pymdown-extensions>=10.15",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "integration: live external/provider integration coverage",
    "models_dev_live: live models.dev catalog contract coverage",
    "requires_secrets: tests that need CI secrets or private credentials",
]
